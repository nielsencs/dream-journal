<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dream Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F6F3EE;
    --bg-sidebar: #1E2235;
    --bg-sidebar-hover: #262B44;
    --bg-sidebar-active: #2E3454;
    --ink: #2B2A33;
    --ink-soft: #6B6875;
    --ink-on-dark: #E7E5F0;
    --ink-on-dark-soft: #8B88A3;
    --accent: #8B7FC7;
    --accent-soft: #EDEAF8;
    --warm: #C9A876;
    --warm-soft: #F5EEE0;
    --border: #E4DFD5;
    --card-bg: #FFFFFF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    overscroll-behavior-y: none;
  }

  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    color: var(--ink-on-dark);
    display: flex;
    flex-direction: column;
  }

  #sidebar-header {
    padding: 20px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  #sidebar-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0 0 12px;
    letter-spacing: 0.2px;
  }

  #search-input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 10px;
    color: var(--ink-on-dark);
    font-size: 14px;
    font-family: inherit;
  }
  #search-input::placeholder { color: var(--ink-on-dark-soft); }
  #search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #search-scope {
    display: flex;
    gap: 6px;
    margin-top: 9px;
  }
  .scope-btn {
    flex: 1;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--ink-on-dark-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .scope-btn.active {
    background: rgba(139,127,199,0.28);
    color: #D9D4F2;
    border-color: var(--accent);
  }

  /* Theme tabs: horizontal scroll row acting as group switcher */
  #theme-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #theme-tabs::-webkit-scrollbar { display: none; }

  .theme-tab {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 100px;
    background: rgba(255,255,255,0.06);
    color: var(--ink-on-dark-soft);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: inherit;
  }
  .theme-tab:hover { background: rgba(255,255,255,0.13); }
  .theme-tab.active {
    background: var(--accent);
    color: #1E2235;
    border-color: var(--accent);
  }

  #new-btn {
    margin: 14px 18px;
    background: var(--accent);
    color: #1E2235;
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }
  #new-btn:active { filter: brightness(1.1); }

  #entry-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 8px 16px;
  }

  .group-header {
    padding: 14px 12px 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-on-dark-soft);
  }
  .group-header:first-child { padding-top: 4px; }

  .entry-item {
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .entry-item:hover { background: var(--bg-sidebar-hover); }
  .entry-item.active { background: var(--bg-sidebar-active); }

  .entry-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-on-dark);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-meta {
    font-size: 11.5px;
    color: var(--ink-on-dark-soft);
    margin-bottom: 4px;
  }
  .entry-snippet {
    font-size: 12.5px;
    color: var(--ink-on-dark-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .entry-tag-pill {
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 100px;
    background: rgba(139,127,199,0.25);
    color: #C9C3EC;
  }

  #empty-list {
    padding: 24px 14px;
    color: var(--ink-on-dark-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  /* ---------- Main panel ---------- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-page);
  }

  #main-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  #editor {
    flex: 1;
    display: none;
    flex-direction: column;
    padding: 28px 40px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #editor.visible { display: flex; }

  #back-btn {
    display: none;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 4px 0 14px;
    cursor: pointer;
  }
  #back-btn svg { width: 18px; height: 18px; }

  #title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  #title-input {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    border: none;
    background: transparent;
    outline: none;
    color: var(--ink);
    width: 100%;
  }
  #title-input::placeholder { color: #B9B4A8; }

  #date-label {
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  #tags-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 8px;
  }
  #tags-row label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  #tags-input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    min-width: 0;
  }
  #tags-input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  #tag-suggestions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    min-height: 14px;
  }
  #tag-suggestions .suggest-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-right: 2px;
  }
  .suggest-chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .suggest-chip:hover { border-color: var(--accent); color: #5B4FA8; }
  .suggest-chip::before { content: "+ "; }

  /* Toggle: dream vs interpretation */
  #mode-toggle {
    display: inline-flex;
    align-self: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
    margin-bottom: 16px;
    gap: 2px;
    max-width: 100%;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: transparent;
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .mode-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .mode-btn.active.dream { background: var(--accent-soft); color: #5B4FA8; }
  .mode-btn.active.interp { background: var(--warm-soft); color: #8A6B32; }

  #panels { flex: 1; display: flex; }

  .panel {
    flex: 1;
    display: none;
  }
  .panel.visible { display: flex; }

  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    background: transparent;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink);
    min-height: 200px;
  }
  #dream-text::placeholder, #interp-text::placeholder { color: #B9B4A8; }

  #save-status {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 10px;
    height: 14px;
  }

  #delete-btn {
    align-self: flex-start;
    margin-top: 18px;
    margin-bottom: 20px;
    background: none;
    border: 1px solid var(--border);
    color: #A8524B;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  #delete-btn:active { background: #FBEAE8; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  #sidebar ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  /* ---------- Mobile layout ---------- */
  @media (max-width: 680px) {
    #app { flex-direction: row; }
    #sidebar { width: 100%; }
    #main { width: 100%; }

    #app.detail-open #sidebar { display: none; }
    #app:not(.detail-open) #main { display: none; }

    #back-btn { display: flex; }

    #editor { padding: 18px 18px 32px; }
    #title-input { font-size: 22px; }
    #mode-toggle { width: 100%; }
    .mode-btn { flex: 1; justify-content: center; }
    #tags-row { flex-wrap: wrap; }
    textarea { font-size: 16px; } /* prevents iOS zoom on focus */
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Dream Journal</h1>
      <input id="search-input" type="text" placeholder="Search…" />
      <div id="search-scope">
        <button class="scope-btn active" data-scope="all">All text</button>
        <button class="scope-btn" data-scope="dream">Dream only</button>
        <button class="scope-btn" data-scope="interp">Interpretation only</button>
      </div>
    </div>
    <div id="theme-tabs"></div>
    <button id="new-btn">+ New dream</button>
    <div id="entry-list"></div>
  </div>

  <div id="main">
    <div id="main-empty">Select a dream, or start a new one.</div>
    <div id="editor">
      <button id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        All dreams
      </button>
      <div id="title-row">
        <input id="title-input" type="text" placeholder="Untitled dream" />
        <span id="date-label"></span>
      </div>
      <div id="tags-row">
        <label for="tags-input">Themes</label>
        <input id="tags-input" type="text" placeholder="e.g. flying, water, family" />
      </div>
      <div id="tag-suggestions"></div>

      <div id="mode-toggle">
        <button class="mode-btn dream" data-mode="dream">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
          Dream
        </button>
        <button class="mode-btn interp" data-mode="interp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Interpretation
        </button>
      </div>

      <div id="panels">
        <div class="panel dream-panel" id="dream-panel">
          <textarea id="dream-text" placeholder="Write the dream as you remember it…"></textarea>
        </div>
        <div class="panel interp-panel" id="interp-panel">
          <textarea id="interp-text" placeholder="What might it mean? Symbols, feelings, waking-life connections…"></textarea>
        </div>
      </div>

      <div id="save-status"></div>
      <button id="delete-btn">Delete dream</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'dreamJournalEntries';
  let dreams = [];
  let activeId = null;
  let activeTagFilter = null;   // theme tab selection (single-select), null = All
  let searchTerm = '';
  let searchScope = 'all';      // 'all' | 'dream' | 'interp'
  let saveTimer = null;

  const el = (id) => document.getElementById(id);
  const appEl = el('app');
  const entryList = el('entry-list');
  const themeTabs = el('theme-tabs');
  const editor = el('editor');
  const mainEmpty = el('main-empty');
  const titleInput = el('title-input');
  const dateLabel = el('date-label');
  const tagsInput = el('tags-input');
  const tagSuggestions = el('tag-suggestions');
  const dreamText = el('dream-text');
  const interpText = el('interp-text');
  const saveStatus = el('save-status');

  function uid() {
    return 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function parseTags(str) {
    return str.split(',').map(t => t.trim()).filter(Boolean);
  }

  function loadDreams() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      dreams = raw ? JSON.parse(raw) : [];
    } catch (e) {
      dreams = [];
    }
    dreams.sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dreams));
      saveStatus.textContent = 'Saved';
      setTimeout(() => { if (saveStatus.textContent === 'Saved') saveStatus.textContent = ''; }, 1200);
    } catch (e) {
      saveStatus.textContent = 'Could not save on this device';
    }
  }

  function allTags() {
    const set = new Set();
    dreams.forEach(d => (d.tags || []).forEach(t => set.add(t)));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  function matchesFilters(d) {
    if (activeTagFilter && !(d.tags || []).includes(activeTagFilter)) return false;
    if (searchTerm) {
      let hay;
      if (searchScope === 'dream') hay = d.title + ' ' + d.content + ' ' + (d.tags || []).join(' ');
      else if (searchScope === 'interp') hay = d.title + ' ' + d.interpretation + ' ' + (d.tags || []).join(' ');
      else hay = d.title + ' ' + d.content + ' ' + d.interpretation + ' ' + (d.tags || []).join(' ');
      if (!hay.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderThemeTabs() {
    const tags = allTags();
    themeTabs.innerHTML = '';

    const allTab = document.createElement('button');
    allTab.className = 'theme-tab' + (activeTagFilter === null ? ' active' : '');
    allTab.textContent = 'All';
    allTab.onclick = () => { activeTagFilter = null; renderThemeTabs(); renderList(); };
    themeTabs.appendChild(allTab);

    tags.forEach(tag => {
      const tab = document.createElement('button');
      tab.className = 'theme-tab' + (activeTagFilter === tag ? ' active' : '');
      tab.textContent = tag;
      tab.onclick = () => {
        activeTagFilter = (activeTagFilter === tag) ? null : tag;
        renderThemeTabs();
        renderList();
      };
      themeTabs.appendChild(tab);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function createEntryItem(d) {
    const item = document.createElement('div');
    item.className = 'entry-item' + (d.id === activeId ? ' active' : '');
    const snippetSource = d.content || d.interpretation || '';
    item.innerHTML = `
      <div class="entry-title">${escapeHtml(d.title || 'Untitled dream')}</div>
      <div class="entry-meta">${formatDate(d.updatedAt)}</div>
      <div class="entry-snippet">${escapeHtml(snippetSource.slice(0, 80))}</div>
      ${(d.tags && d.tags.length) ? `<div class="entry-tags">${d.tags.map(t => `<span class="entry-tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    `;
    item.onclick = () => selectDream(d.id);
    return item;
  }

  function renderList() {
    entryList.innerHTML = '';
    const visible = dreams.filter(matchesFilters);

    if (dreams.length === 0) {
      entryList.innerHTML = '<div id="empty-list">No dreams logged yet. Tap "New dream" to write one down.</div>';
      return;
    }
    if (visible.length === 0) {
      entryList.innerHTML = '<div id="empty-list">Nothing matches this filter.</div>';
      return;
    }

    if (activeTagFilter) {
      // Single theme selected via tab: flat list, already global-sorted by recency
      visible.forEach(d => entryList.appendChild(createEntryItem(d)));
      return;
    }

    // "All" view: group visually by theme so groups are easy to scan
    const groups = {};
    const untagged = [];
    visible.forEach(d => {
      if (d.tags && d.tags.length) {
        d.tags.forEach(t => { (groups[t] = groups[t] || []).push(d); });
      } else {
        untagged.push(d);
      }
    });

    const tagNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
    tagNames.forEach(tag => {
      const header = document.createElement('div');
      header.className = 'group-header';
      header.textContent = tag;
      entryList.appendChild(header);
      groups[tag].forEach(d => entryList.appendChild(createEntryItem(d)));
    });

    if (untagged.length) {
      const header = document.createElement('div');
      header.className = 'group-header';
      header.textContent = 'Untagged';
      entryList.appendChild(header);
      untagged.forEach(d => entryList.appendChild(createEntryItem(d)));
    }
  }

  function renderTagSuggestions() {
    const current = parseTags(tagsInput.value);
    const suggestions = allTags().filter(t => !current.includes(t));
    tagSuggestions.innerHTML = '';
    if (suggestions.length === 0) return;
    const label = document.createElement('span');
    label.className = 'suggest-label';
    label.textContent = 'Add:';
    tagSuggestions.appendChild(label);
    suggestions.forEach(tag => {
      const chip = document.createElement('button');
      chip.className = 'suggest-chip';
      chip.textContent = tag;
      chip.onclick = () => {
        const tags = parseTags(tagsInput.value);
        tags.push(tag);
        tagsInput.value = tags.join(', ');
        renderTagSuggestions();
        scheduleSave();
      };
      tagSuggestions.appendChild(chip);
    });
  }

  function selectDream(id) {
    activeId = id;
    const d = dreams.find(x => x.id === id);
    if (!d) return;
    mainEmpty.style.display = 'none';
    editor.classList.add('visible');
    appEl.classList.add('detail-open');
    titleInput.value = d.title || '';
    dateLabel.textContent = formatDate(d.updatedAt);
    tagsInput.value = (d.tags || []).join(', ');
    dreamText.value = d.content || '';
    interpText.value = d.interpretation || '';
    setMode('dream');
    renderTagSuggestions();
    renderList();
  }

  function goBackToList() {
    appEl.classList.remove('detail-open');
  }

  function setMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    el('dream-panel').classList.toggle('visible', mode === 'dream');
    el('interp-panel').classList.toggle('visible', mode === 'interp');
  }

  function currentDream() {
    return dreams.find(x => x.id === activeId);
  }

  function scheduleSave() {
    saveStatus.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commitEdits, 500);
  }

  function commitEdits() {
    const d = currentDream();
    if (!d) return;
    d.title = titleInput.value;
    d.content = dreamText.value;
    d.interpretation = interpText.value;
    d.tags = parseTags(tagsInput.value);
    d.updatedAt = Date.now();
    dreams.sort((a, b) => b.updatedAt - a.updatedAt);
    persist();
    renderThemeTabs();
    renderList();
  }

  function newDream() {
    const d = {
      id: uid(),
      title: '',
      content: '',
      interpretation: '',
      tags: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    dreams.unshift(d);
    persist();
    renderThemeTabs();
    renderList();
    selectDream(d.id);
    titleInput.focus();
  }

  function deleteActive() {
    if (!activeId) return;
    dreams = dreams.filter(x => x.id !== activeId);
    activeId = null;
    persist();
    renderThemeTabs();
    renderList();
    editor.classList.remove('visible');
    mainEmpty.style.display = 'flex';
    goBackToList();
  }

  // Wiring
  el('new-btn').onclick = newDream;
  el('delete-btn').onclick = deleteActive;
  el('back-btn').onclick = goBackToList;
  document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll('.scope-btn').forEach(b => b.onclick = () => {
    searchScope = b.dataset.scope;
    document.querySelectorAll('.scope-btn').forEach(x => x.classList.toggle('active', x === b));
    renderList();
  });
  [titleInput, dreamText, interpText].forEach(input => {
    input.addEventListener('input', scheduleSave);
  });
  tagsInput.addEventListener('input', () => {
    renderTagSuggestions();
    scheduleSave();
  });
  el('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderList();
  });

  loadDreams();
  renderThemeTabs();
  renderList();
})();
</script>

</body>
</html>
